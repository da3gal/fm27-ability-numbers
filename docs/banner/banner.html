<!doctype html>
<!-- README banner source. Render: see docs/banner/README.md -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  :root {
    --navy: #0b0f2e; --plum: #2a0c3e; --magenta: #ff3ea5; --gold: #f6c548;
    --ink: #f4f2ff; --muted: #b9b3dc; --line: rgba(255,255,255,.09); --empty: #4a4e78;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 400px; background: transparent; }
  .banner {
    position: relative; width: 1280px; height: 400px; border-radius: 24px; overflow: hidden;
    background:
      radial-gradient(520px 340px at 88% 30%, rgba(255,62,165,.30), transparent 70%),
      radial-gradient(600px 400px at 0% 100%, rgba(84,72,255,.22), transparent 70%),
      linear-gradient(120deg, var(--navy) 0%, #151a46 45%, var(--plum) 100%);
    font-family: Inter, sans-serif; color: var(--ink);
  }
  .pitch { position: absolute; inset: 0; }
  .content { position: absolute; left: 72px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
  .eyebrow { font-size: 15px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--magenta); }
  h1 { font-family: "Barlow Condensed", sans-serif; font-weight: 800; font-size: 86px; line-height: .92; letter-spacing: .01em; }
  h1 span { color: var(--magenta); }
  .tagline { font-size: 22px; line-height: 1.4; color: var(--muted); max-width: 540px; }
  .tagline b { color: var(--ink); font-weight: 600; }
  .chips { display: flex; gap: 10px; margin-top: 6px; }
  .chip { font-size: 14px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); color: var(--ink); }
  .card {
    position: absolute; right: 64px; top: 50%; transform: translateY(-50%); width: 452px; padding: 26px 28px;
    border-radius: 18px; background: rgba(16,19,52,.78); border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 30px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06); backdrop-filter: blur(6px);
  }
  .who { display: flex; align-items: center; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
  .avatar { width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(160deg, #3a3f7a, #1b1f4b); position: relative; overflow: hidden; flex: none; }
  .avatar::before { content: ""; position: absolute; left: 50%; top: 13px; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; background: #8b8fc9; }
  .avatar::after { content: ""; position: absolute; left: 50%; top: 38px; width: 42px; height: 30px; margin-left: -21px; border-radius: 21px 21px 0 0; background: #8b8fc9; }
  .name { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 30px; line-height: 1; }
  .meta { font-size: 14px; color: var(--muted); margin-top: 5px; }
  .pill { margin-left: auto; font-weight: 700; font-size: 17px; padding: 8px 12px; border-radius: 10px; border: 2px solid var(--magenta); color: var(--ink); white-space: nowrap; }
  .row { display: flex; align-items: center; padding-top: 18px; }
  .row .label { font-size: 15px; font-weight: 600; color: var(--muted); width: 150px; }
  .stars { font-size: 24px; letter-spacing: 2px; color: var(--gold); }
  .stars i { font-style: normal; color: var(--empty); }
  .stars .half { background: linear-gradient(90deg, var(--gold) 50%, var(--empty) 50%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .num { margin-left: 12px; font-weight: 700; font-size: 20px; color: var(--ink); }
</style>
</head>
<body>
  <div class="banner">
    <svg class="pitch" width="1280" height="400" viewBox="0 0 1280 400" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="2">
      <line x1="860" y1="0" x2="860" y2="400"/>
      <circle cx="860" cy="200" r="118"/>
      <circle cx="860" cy="200" r="4" fill="rgba(255,255,255,0.10)"/>
      <rect x="1150" y="70" width="160" height="260"/>
      <rect x="1230" y="140" width="80" height="120"/>
    </svg>
    <div class="content">
      <div class="eyebrow">BepInEx plugin · Football Manager 27</div>
      <h1>FM27 Ability<br><span>Numbers</span></h1>
      <p class="tagline">The <b>real Current &amp; Potential Ability</b>, right inside FM's own screens.</p>
      <div class="chips"><span class="chip">Every player</span><span class="chip">Exact column sort</span><span class="chip">Read-only</span></div>
    </div>
    <div class="card">
      <div class="who">
        <div class="avatar"></div>
        <div><div class="name">Luca Moretti</div><div class="meta">AM (C) · 19 years old</div></div>
        <div class="pill">CA 158 · PA 186</div>
      </div>
      <div class="row"><span class="label">Current Ability</span><span class="stars">★★★<span class="half">★</span><i>★</i></span><span class="num">158</span></div>
      <div class="row"><span class="label">Potential Ability</span><span class="stars">★★★★<span class="half">★</span></span><span class="num">186</span></div>
    </div>
  </div>
</body>
</html>
